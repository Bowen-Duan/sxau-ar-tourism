# 数据源配置
spring:
  datasource:
    druid:
      # 主库数据源
      master:
        url: jdbc:mysql://127.0.0.1:3306/travel?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&serverTimezone=GMT%2B8&autoReconnect=true&useSSL=false
        username: webuser
        password: ${DB_PASSWORD:}
  # redis 配置
  redis:
    # 地址
    host: 106.15.105.36
    # 端口，默认为6379
    port: 6379
    # 密码
    password: ${REDIS_PASSWORD:}
    database: 3
# 微信小程序相关配置
wx:
  miniapp:
    configs:
      - appid: wx6eaeabceda8fb957
        secret: ${WX_MINIAPP_SECRET:}
        token: ${WX_MINIAPP_TOKEN:}
        aesKey: ${WX_MINIAPP_AES_KEY:}
        msgDataFormat: JSON
  mp:
    useRedis: true
    configs:
      - appId: wxc2bbb6696a04ecd2 # 第一个公众号的appid
        secret: ${WX_MP_SECRET:} # 公众号的appsecret
        token: test # 接口配置里的Token值
        aesKey: test # 接口配置里的EncodingAESKey值
  pay:
    configs:
      - appId: wxc2bbb6696a04ecd2 #微信h5支付
        mchId: 1489745992
        mchKey: ${WX_PAY_MCH_KEY:}
        subAppId: #服务商模式下的子商户公众账号ID
        subMchId: #服务商模式下的子商户号
        keyPath: # p12证书的位置，可以指定绝对路径，也可以指定类路径（以classpath:开头）
      - appId: wx6eaeabceda8fb957 #微信小程序支付
        mchId: 1489745992
        mchKey: ${WX_PAY_MCH_KEY:}
        subAppId: #服务商模式下的子商户公众账号ID
        subMchId: #服务商模式下的子商户号
        keyPath: # p12证书的位置，可以指定绝对路径，也可以指定类路径（以classpath:开头）
